<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Pata — leaf writing on a page</title>
  <desc id="desc">A green leaf shaped like a fountain pen rises from an ivory page with a folded corner and three lines of text, on a deep forest green background.</desc>

  <!-- Background -->
  <rect width="1254" height="1254" fill="#043c17"/>

  <!-- Page with cut top-right corner -->
  <path d="M377 390 H845 L973 523 V910 Q973 960 923 960 H377 Q327 960 327 910 V440 Q327 390 377 390Z" fill="#fbf8ec"/>
  <!-- Folded corner -->
  <path d="M846 390 L973 523 H880 Q846 523 846 489 Z" fill="#93c47d"/>

  <!-- Text lines -->
  <g fill="#93c47d">
    <rect x="617" y="606" width="300" height="27" rx="13.5"/>
    <rect x="617" y="675" width="300" height="27" rx="13.5"/>
    <rect x="617" y="744" width="300" height="27" rx="13.5"/>
  </g>

  <!-- Dark crescent along leaf's left edge -->
  <path d="M443 340 L443 392 C429 450 431 522 452 568 C465 595 482 608 497 612 L540 560 L520 340 Z" fill="#043c17"/>

  <!-- Leaf: outline -->
  <path id="leaf" d="M497 612
           C462 575 444 520 449 455
           C456 340 550 255 640 218
           C720 188 790 155 805 113
           C830 190 832 290 812 375
           C792 455 750 530 680 553
           C615 573 570 580 552 622
           Z" fill="#6cc53a"/>
  <!-- Leaf: dark half -->
  <path d="M805 113
           C830 190 832 290 812 375
           C792 455 750 530 680 553
           C615 573 570 580 552 622
           L513 615
           C482 545 480 472 540 418
           C575 388 640 358 700 315
           C775 260 800 190 805 113Z" fill="#10792e"/>

  <!-- Leaf veins -->
  <path d="M513 615 C512 565 524 520 541 478 C562 424 598 330 665 262
           C628 325 604 392 583 440 C566 490 538 555 513 615Z" fill="#b2e090"/>
  <path d="M572 452 C640 397 700 372 765 354
           C705 386 658 416 620 454 C578 497 540 553 513 615
           C520 553 536 498 558 466 C562 460 567 456 572 452Z" fill="#b2e090"/>

  <!-- Nib -->
  <path d="M478 612 C505 622 532 626 557 629
           C553 650 556 680 567 725
           C530 750 490 810 455 860
           C462 810 458 760 428 705
           C455 675 472 645 478 612Z" fill="#06431b"/>
  <circle cx="496" cy="702" r="17" fill="#fbf8ec"/>
  <path d="M488 716 L504 712 L468 826 L462 826Z" fill="#fbf8ec"/>

  <!-- Swoosh -->
  <path d="M447 872
           C500 838 570 826 645 836
           C720 847 790 872 860 837
           C810 880 740 892 665 876
           C590 860 525 842 447 872Z" fill="#06431b"/>
</svg>
