<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pata — নিজের পাতা, কয়েক মিনিটে</title>
    <meta
      name="description"
      content="পাতা বাংলাদেশি ক্রিয়েটরদের নিজের প্রকাশনার ঠিকানা — you.pata.page ঠিকানায় ব্লগ, পোর্টফোলিও বা মিনি নিউজ সাইট। বাংলা-প্রথম, মূল্য টাকায়, বিকাশ/নগদে পেমেন্ট। ওয়েটলিস্টে যোগ দিন।"
    />
    <link rel="icon" type="image/svg+xml" href="/pata-logo.svg" />
    <meta name="theme-color" content="#f4f1df" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pata — নিজের পাতা, কয়েক মিনিটে" />
    <meta
      property="og:description"
      content="পাতা — বাংলাদেশি ক্রিয়েটরদের নিজের প্রকাশনার ঠিকানা। you.pata.page ঠিকানায় ব্লগ, পোর্টফোলিও বা মিনি নিউজ সাইট, বাংলা-প্রথম।"
    />
    <meta property="og:image" content="/og.png" />
    <script>
      // Apply the stored theme before first paint (default: day).
      try {
        if (localStorage.getItem("pata-theme") === "night") {
          document.documentElement.dataset.theme = "night";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
